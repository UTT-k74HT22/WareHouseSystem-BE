# Docker Compose configuration for monitoring stack (Prometheus, Grafana, Exporters)
# This configuration sets up Prometheus for metrics collection, Grafana for visualization, and exporters for MySQL and Redis.
# Note: Ensure that the 'whs_private' network is created before running this compose file.
# Edit: DungHD - 2026-04-01: Updated image versions and added more detailed comments.

services:
  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: whs_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - whs_private

  grafana:
    image: grafana/grafana:11.6.0
    container_name: whs_grafana
    hostname: grafana
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: console
    volumes:
      - ./monitoring/grafana/data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - whs_private

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: whs_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    networks:
      - whs_private

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: whs_mysql_exporter
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_USER}:${MYSQL_EXPORTER_PASSWORD}@(mysql:3306)/"
    ports:
      - "9104:9104"
    command:
      - '--collect.engine_innodb_status'
      - '--collect.info_schema.processlist'
      - '--collect.info_schema.tables'
      - '--collect.info_schema.query_response_time'
      - '--collect.perf_schema.file_events'
      - '--collect.perf_schema.eventsstatements'
      - '--collect.perf_schema.indexiowaits'
      - '--collect.global_status'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - whs_private

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: whs_redis_exporter
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - whs_private

networks:
  whs_private:
    external: true
    name: deploy_whs_private
