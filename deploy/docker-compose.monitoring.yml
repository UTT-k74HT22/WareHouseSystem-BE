services:
  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: whs_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - whs_private

  grafana:
    image: grafana/grafana:11.6.0
    container_name: whs_grafana
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana_password}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://monitoring.example.com/grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - whs_private

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: whs_node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - whs_private

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: whs_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - whs_private

networks:
  whs_private:
    driver: bridge
