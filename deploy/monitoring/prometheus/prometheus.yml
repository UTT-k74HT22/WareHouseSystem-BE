global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']
    metrics_path: '/metrics'

  - job_name: 'whs-app'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8080']
    metrics_path: '/actuator/prometheus'

  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mysql-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['mysql-exporter:9104']
    metrics_path: '/metrics'

  - job_name: 'redis-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'
