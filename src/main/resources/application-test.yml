spring:
  # Disable infrastructure auto-config that is not needed in tests.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # Also disable session auto-config when the app uses Spring Session Redis.
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

  flyway:
    enabled: false

  # Do not use Redis-backed HTTP sessions in tests.
  session:
    store-type: none

  # Keep default Redis placeholders available in case some beans still read them.
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  # H2 database for test execution.
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true

  main:
    allow-bean-definition-overriding: true

app:
  jwt:
    secret: "p1zs6HE4bebUL6aVjJhSEtj/Bp4rhQPK3vUR2gpcA06muNhYO77Z9kzb3U5sDXBkdpEZwECJfm0tNuDRiVu29g=="
    access-token-expiration: 3600s
    refresh-token-expiration: 86400s

logging:
  level:
    root: INFO
    org.demo.whs: DEBUG
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
