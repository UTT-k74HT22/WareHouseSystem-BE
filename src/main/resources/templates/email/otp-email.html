<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f9;">
    <tr>
        <td align="center" style="padding:40px 15px;">

            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:480px;background:#ffffff;border-collapse:collapse;">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding:30px 20px 10px 20px;">
                        <h2 style="margin:0;color:#222;font-size:20px;"
                            th:text="${title}">
                            Email Verification
                        </h2>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td align="center" style="padding:20px;color:#555;font-size:15px;line-height:1.6;">

                        <p style="margin:0 0 20px 0;">
                            Use the following OTP to continue:
                        </p>

                        <table cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center"
                                    style="background:#eef2ff;
                                           padding:15px 30px;
                                           font-size:28px;
                                           font-weight:bold;
                                           letter-spacing:6px;
                                           color:#2e6cff;">
                                    <span th:text="${otp}">123456</span>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:25px 0 0 0;">
                            This code will expire in
                            <strong th:text="${ttlMinutes}">5</strong>
                            minutes.
                        </p>

                        <p style="margin-top:20px;font-size:13px;color:#888;">
                            If you did not request this, you can safely ignore this email.
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center"
                        style="padding:20px;font-size:12px;color:#aaa;">
                        © 2026 Warehouse Management System<br>
                        This is an automated message.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
