spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  # DataSource Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Session Configuration with Redis
  session:
    store-type: redis
    timeout: 1800s
    redis:
      flush-mode: on_save
      namespace: spring:session

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false   # Disabled in development for easier template debugging.

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:example@gmail.com}
    password: ${MAIL_PASSWORD:your-email-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.demo.whs: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis.cache: DEBUG

# Custom Application Properties
app:
  jwt:
    secret: ${JWT_SECRET:default_jwt_secret_key}
    access-token-expiration: 3600s # 1 hour
    refresh-token-expiration: 86400s # 24 hours
    reset-token-expiration: PT5M
  cors:
    # CORS Configuration for Frontend
    # Development: localhost with the most common frontend ports.
    # Production: replace with the real frontend domain.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:8080,http://192.168.102.186:4200}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    max-age: 3600 # Cache preflight request for 1 hour

  # Rate Limiting Configuration
  rate-limit:
    enabled: true
    # Default rate limit for endpoints without dedicated overrides.
    default:
      limit: 100
      duration: 60 # seconds
    # Custom rate limits for sensitive endpoints.
    endpoints:
      login:
        limit: 5
        duration: 300 # 5 minutes to reduce brute-force attempts
      register:
        limit: 3
        duration: 3600 # 1 hour
      refresh-token:
        limit: 10
        duration: 60

  # MinIO Configuration
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:whs-storage}
    presigned-url-expiry: 3600 # seconds - 1 hour

  # Email Configuration
  email:
    enabled: true
    from: ${EMAIL_FROM:noreply@warehouse.com}
    from-name: ${EMAIL_FROM_NAME:Warehouse Management System}
    max-retry: 3
    retry-delay-seconds: 60
    async-by-default: true
    attachment-path: ${EMAIL_ATTACHMENT_PATH:temp/email-attachments}
    max-attachment-size-mb: 10
    log-retention-days: 90

  # Gemini AI Configuration
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta/models/

  # OTP Configuration
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    resend-limit-seconds: ${OTP_RESEND_LIMIT_SECONDS:60}
    count-ttl-hours: ${OTP_COUNT_TTL_HOURS:24}
    max-send-per-day: ${OTP_MAX_SEND_PER_DAY:10}

  # Config for RabbitMQ queues, exchanges, and retry/dlq settings for both email and job processing.
  rabbitmq:
    email:
      exchange: whs.email.exchange
      queue: whs.email.queue
      retry-queue: whs.email.retry.queue
      dlq: whs.email.dlq
      routing-key: whs.email.send
      retry-routing-key: whs.email.retry
      dlq-routing-key: whs.email.failed
      retry-ttl-ms: 30000
      concurrent-consumers: 3
      max-consumers: 10
      prefetch: 1
    
    background-job:
      exchange: whs.background-job.exchange
      queue: whs.background-job.queue
      retry-queue: whs.background-job.retry.queue
      dlq: whs.background-job.dlq
      routing-key: whs.background-job.process
      retry-routing-key: whs.background-job.retry
      dlq-routing-key: whs.background-job.failed
      retry-ttl-ms: 60000
      concurrent-consumers: 2
      max-consumers: 4
      prefetch: 1
      export-folder: background-jobs/exports
