spring:
  application:
    name: ${SPRING_APPLICATION_NAME:whs-backend}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  session:
    store-type: redis
    timeout: 1800s
    redis:
      flush-mode: on_save
      namespace: spring:session

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600s
    refresh-token-expiration: 86400s
    reset-token-expiration: PT5M

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:8080}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    max-age: ${CORS_MAX_AGE:3600}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default:
      limit: 100
      duration: 60
    endpoints:
      login:
        limit: 5
        duration: 300
      register:
        limit: 3
        duration: 3600
      refresh-token:
        limit: 10
        duration: 60

  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:noreply@warehouse.com}
    from-name: ${EMAIL_FROM_NAME:Warehouse Management System}
    max-retry: ${EMAIL_MAX_RETRY:3}
    retry-delay-seconds: ${EMAIL_RETRY_DELAY_SECONDS:60}
    async-by-default: ${EMAIL_ASYNC_BY_DEFAULT:true}
    attachment-path: ${EMAIL_ATTACHMENT_PATH:temp/email-attachments}
    max-attachment-size-mb: 10
    log-retention-days: 90

  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    resend-limit-seconds: ${OTP_RESEND_LIMIT_SECONDS:60}
    count-ttl-hours: ${OTP_COUNT_TTL_HOURS:24}
    max-send-per-day: ${OTP_MAX_SEND_PER_DAY:10}

  # Config for RabbitMQ queues, exchanges, and retry/dlq settings for both email and job processing.
  rabbitmq:
    email:
      exchange: whs.email.exchange
      queue: whs.email.queue
      retry-queue: whs.email.retry.queue
      dlq: whs.email.dlq
      routing-key: whs.email.send
      retry-routing-key: whs.email.retry
      dlq-routing-key: whs.email.failed
      retry-ttl-ms: 30000
      concurrent-consumers: 3
      max-consumers: 10
      prefetch: 1

    background-job:
      exchange: whs.background-job.exchange
      queue: whs.background-job.queue
      retry-queue: whs.background-job.retry.queue
      dlq: whs.background-job.dlq
      routing-key: whs.background-job.process
      retry-routing-key: whs.background-job.retry
      dlq-routing-key: whs.background-job.failed
      retry-ttl-ms: 60000
      concurrent-consumers: 2
      max-consumers: 4
      prefetch: 1
      export-folder: background-jobs/exports