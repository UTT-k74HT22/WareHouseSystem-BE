spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3306}}/${MYSQL_DATABASE:whs_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:whs_user}
    password: ${MYSQL_PASSWORD:change_me_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.demo.whs: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis.cache: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:+7AwfTloEoOVuvvXKGKHBHKtTJuBd1SRf0khMhdJmdw2RB/e6FuurZ5iULDDB2/MZNp33owsr1RIjxNfmnJguw==}
  minio:
    endpoint: ${MINIO_ENDPOINT:${MINIO_URL:http://localhost:9000}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:${MINIO_BUCKET:whs-storage}}
    presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:3600}
