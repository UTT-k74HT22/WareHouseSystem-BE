name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - staging
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/be-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/whs-backend

jobs:
  build-and-test:
    name: Build & Verify Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 1

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/whs-backend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Deploy to Server (163.61.72.183)
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/whs-backend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VMWARE_HOST || '163.61.72.183' }}
          username: ${{ secrets.SERVER_USER || secrets.VMWARE_USER || 'devops' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.VMWARE_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE || secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || secrets.VMWARE_PORT || 22 }}
          script: |
            set -e
            echo "==== Deploying WHS Backend ===="
            DEPLOY_DIR="/home/devops/whs/WareHouseSystem-INFRA/deploy"

            # Ensure data/log directories exist with proper write permissions for non-root container
            mkdir -p "$DEPLOY_DIR/logs/app" "$DEPLOY_DIR/data/email-attachments"
            chmod -R 777 "$DEPLOY_DIR/logs/app" "$DEPLOY_DIR/data/email-attachments" || true
            cd "$DEPLOY_DIR"

            # Pull latest backend image
            # NOTE: GHCR_TOKEN must be a PAT with read:packages scope — GITHUB_TOKEN does NOT work from external servers
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "Pulling $IMAGE_REF..."
            docker pull "$IMAGE_REF"

            # Recreate app container
            echo "Recreating backend app container..."
            APP_IMAGE="$IMAGE_REF" docker compose -f docker-compose.vps.yml up -d --no-deps --force-recreate app

            # Actively poll healthcheck
            echo "Waiting for app container (whs_be) to become healthy..."
            TIMEOUT=120
            ELAPSED=0
            STATUS=""
            while [ $ELAPSED -lt $TIMEOUT ]; do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' whs_be 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ Backend container (whs_be) is healthy after ${ELAPSED}s!"
                break
              elif [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "✗ Backend container entered $STATUS state!"
                docker logs --tail 100 whs_be
                exit 1
              fi
              echo "Status: $STATUS (${ELAPSED}/${TIMEOUT}s)..."
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "✗ Timed out waiting for whs_be to become healthy."
              docker logs --tail 100 whs_be
              exit 1
            fi

            # Reload Nginx upstream connections to avoid 502 Bad Gateway
            echo "Reloading Nginx upstream resolution..."
            docker exec whs_nginx nginx -s reload || docker compose -f docker-compose.vps.yml restart nginx || true

            # Prune dangling Docker images
            docker image prune -f || true

            echo "==== Backend deployment successfully completed! ===="
