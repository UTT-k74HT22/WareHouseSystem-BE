name: Deploy VMware

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker tag cần deploy, ví dụ sha-abcdef hoặc latest. Để trống sẽ dùng sha của ref hiện tại."
        required: false
        default: ""
      enable_monitoring:
        description: "Bật rollout thêm monitoring stack"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vmware-demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare deployment metadata
        id: prep
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          DISPATCH_ENABLE_MONITORING: ${{ github.event.inputs.enable_monitoring }}
          VMWARE_HOST: ${{ secrets.VMWARE_HOST }}
          VMWARE_PORT: ${{ secrets.VMWARE_PORT }}
          VMWARE_USER: ${{ secrets.VMWARE_USER }}
          VMWARE_DEPLOY_PATH: ${{ secrets.VMWARE_DEPLOY_PATH }}
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(echo "${GITHUB_EVENT_REPOSITORY_NAME:-${GITHUB_REPOSITORY#*/}}" | tr '[:upper:]' '[:lower:]')"
          registry_image="ghcr.io/${owner_lc}/${repo_lc}"

          if [[ "${WORKFLOW_EVENT}" == "workflow_run" ]]; then
            image_tag="sha-${WORKFLOW_RUN_SHA}"
            enable_monitoring="false"
          else
            image_tag="${DISPATCH_IMAGE_TAG}"
            enable_monitoring="${DISPATCH_ENABLE_MONITORING:-false}"
            if [[ -z "${image_tag}" ]]; then
              image_tag="sha-${GITHUB_SHA}"
            fi
          fi

          ssh_port="${VMWARE_PORT:-22}"
          deploy_root="${VMWARE_DEPLOY_PATH:-/opt/whs}"

          echo "registry_image=${registry_image}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${registry_image}:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "enable_monitoring=${enable_monitoring}" >> "$GITHUB_OUTPUT"
          echo "ssh_target=${VMWARE_USER}@${VMWARE_HOST}" >> "$GITHUB_OUTPUT"
          echo "ssh_port=${ssh_port}" >> "$GITHUB_OUTPUT"
          echo "deploy_root=${deploy_root}" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VMWARE_SSH_KEY }}

      - name: Add pinned known hosts
        if: secrets.VMWARE_SSH_KNOWN_HOSTS != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VMWARE_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Discover host key
        if: secrets.VMWARE_SSH_KNOWN_HOSTS == ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.prep.outputs.ssh_port }}" -H "${{ secrets.VMWARE_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Bootstrap remote folders
        run: |
          ssh -p "${{ steps.prep.outputs.ssh_port }}" -o StrictHostKeyChecking=yes "${{ steps.prep.outputs.ssh_target }}" "
            mkdir -p \
              '${{ steps.prep.outputs.deploy_root }}/deploy' \
              '${{ steps.prep.outputs.deploy_root }}/scripts' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/certs' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/data/mysql' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/data/redis' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/data/rabbitmq' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/data/minio' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/data/email-attachments' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/logs/app' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/logs/nginx' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/monitoring/prometheus/data' \
              '${{ steps.prep.outputs.deploy_root }}/deploy/monitoring/grafana/data'
          "

      - name: Sync deploy assets
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'certs/' \
            --exclude 'data/' \
            --exclude 'logs/' \
            --exclude 'monitoring/prometheus/data/' \
            --exclude 'monitoring/grafana/data/' \
            -e "ssh -p ${{ steps.prep.outputs.ssh_port }} -o StrictHostKeyChecking=yes" \
            deploy/ "${{ steps.prep.outputs.ssh_target }}:${{ steps.prep.outputs.deploy_root }}/deploy/"

          rsync -az --delete \
            -e "ssh -p ${{ steps.prep.outputs.ssh_port }} -o StrictHostKeyChecking=yes" \
            scripts/ "${{ steps.prep.outputs.ssh_target }}:${{ steps.prep.outputs.deploy_root }}/scripts/"

      - name: Deploy application on VMware
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -p "${{ steps.prep.outputs.ssh_port }}" -o StrictHostKeyChecking=yes "${{ steps.prep.outputs.ssh_target }}" "
            set -euo pipefail
            printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
            chmod +x '${{ steps.prep.outputs.deploy_root }}/scripts/deploy/deploy-vmware.sh'
            APP_IMAGE='${{ steps.prep.outputs.image_ref }}' \
            ENABLE_MONITORING='${{ steps.prep.outputs.enable_monitoring }}' \
            DEPLOY_ROOT='${{ steps.prep.outputs.deploy_root }}' \
            '${{ steps.prep.outputs.deploy_root }}/scripts/deploy/deploy-vmware.sh'
          "

      - name: Summarize deployment
        run: |
          {
            echo "## VMware deployment"
            echo
            echo "- Host: \`${{ secrets.VMWARE_HOST }}\`"
            echo "- Path: \`${{ steps.prep.outputs.deploy_root }}\`"
            echo "- Image: \`${{ steps.prep.outputs.image_ref }}\`"
            echo "- Monitoring: \`${{ steps.prep.outputs.enable_monitoring }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
